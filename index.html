<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markup & GST Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .calculator-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 24px;
        }
        h2 {
            margin-top: 0;
            color: #1a1a1a;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #0066cc;
        }
        .results {
            margin-top: 24px;
            background: #f9fbfd;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 16px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 2px dashed #cbd5e1;
            font-weight: bold;
            font-size: 17px;
            color: #0066cc;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Markup & GST Calculator</h2>
    
    <div class="form-group">
        <label for="costPrice">Cost Price (₹)</label>
        <input type="number" id="costPrice" placeholder="e.g. 1000" oninput="calculate()">
    </div>

    <div class="form-group">
        <label for="profitMarkup">Profit Markup (%)</label>
        <input type="number" id="profitMarkup" placeholder="e.g. 20" oninput="calculate()">
    </div>

    <div class="form-group">
        <label for="gstRate">GST Rate (%)</label>
        <select id="gstRate" onchange="calculate()">
            <option value="5">5%</option>
            <option value="12">12%</option>
            <option value="18" selected>18%</option>
            <option value="28">28%</option>
        </select>
    </div>

    <div class="results">
        <div class="result-row">
            <span>Profit Amount:</span>
            <span id="profitAmount">₹0.00</span>
        </div>
        <div class="result-row">
            <span>Selling Price (Excl. GST):</span>
            <span id="sellingPrice">₹0.00</span>
        </div>
        <div class="result-row">
            <span>GST Amount:</span>
            <span id="gstAmount">₹0.00</span>
        </div>
        <div class="result-row">
            <span>Final Price (Incl. GST):</span>
            <span id="finalPrice">₹0.00</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const cost = parseFloat(document.getElementById('costPrice').value) || 0;
        const markup = parseFloat(document.getElementById('profitMarkup').value) || 0;
        const gstRate = parseFloat(document.getElementById('gstRate').value) || 0;

        // Profit Markup Formula:
        // Profit = Cost * (Markup / 100)
        // Selling Price = Cost + Profit
        const profit = cost * (markup / 100);
        const sellingPrice = cost + profit;

        const gstAmount = sellingPrice * (gstRate / 100);
        const finalPrice = sellingPrice + gstAmount;

        document.getElementById('profitAmount').textContent = '₹' + profit.toFixed(2);
        document.getElementById('sellingPrice').textContent = '₹' + sellingPrice.toFixed(2);
        document.getElementById('gstAmount').textContent = '₹' + gstAmount.toFixed(2);
        document.getElementById('finalPrice').textContent = '₹' + finalPrice.toFixed(2);
    }
</script>

</body>
</html>

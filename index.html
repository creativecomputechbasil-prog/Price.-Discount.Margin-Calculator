<body>

  <div class="app-header">
    <div class="app-title">
      <i class="fa-solid fa-calculator text-emerald-400"></i>
      <span>MARGIN & GST CALCULATOR</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-copy" onclick="copyCSV()">
        <i class="fa-solid fa-copy"></i> Copy
      </button>
      <button class="btn btn-reset" onclick="resetAllData()">
        <i class="fa-solid fa-rotate-left"></i> RESET
      </button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-index">#</th>
          <th class="col-a">A<br><span style="font-size:8px;font-weight:normal;">Price</span></th>
          <th class="col-z">Z<br><span style="font-size:8px;font-weight:normal;">Disc %</span></th>
          <th class="col-x">X<br><span style="font-size:8px;font-weight:normal;">Disc Price</span></th>
          <th class="col-xgst">X+18%<br><span style="font-size:8px;font-weight:normal;">Price+GST</span></th>
          <th class="col-b">B<br><span style="font-size:8px;font-weight:normal;">Margin</span></th>
          <th class="col-c">C<br><span style="font-size:8px;font-weight:normal;">Total</span></th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- 15 Rows generated dynamically -->
      </tbody>
      <tfoot>
        <tr>
          <td class="row-index">TOT</td>
          <td class="col-a" id="totalA">0</td>
          <td class="col-z" id="totalZ">0.00</td>
          <td class="col-x" id="totalX">0.00</td>
          <td class="col-xgst" id="totalXgst">0.00</td>
          <td class="col-b" id="totalB">0</td>
          <td class="col-c" id="totalC">0.00</td>
          <td class="col-action"></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="toast" class="toast">
    <i class="fa-solid fa-check text-emerald-400"></i>
    <span id="toastMsg">Action complete</span>
  </div>

  <script>
    const TOTAL_ROWS = 15;
    const STORAGE_KEY = "clean_margin_gst_calc_v2";

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { 
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length === TOTAL_ROWS) {
            return parsed;
          }
        } catch(e) {}
      }
      return Array.from({ length: TOTAL_ROWS }, () => ({ price: "", discount: "", margin: "" }));
    }

    let rowsData = loadData();

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      for (let i = 0; i < TOTAL_ROWS; i++) {
        const rowData = rowsData[i] || { price: "", discount: "", margin: "" };
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td class="row-index">${i + 1}</td>
          
          <!-- Column A (Price) - Input field (Blue header) -->
          <td class="col-a">
            <input type="number" inputmode="decimal" id="price-${i}" value="${rowData.price || ''}" placeholder="" oninput="handleInput(${i})">
          </td>
          
          <!-- Column Z (Disc %) - Input field (Cyan header) -->
          <td class="col-z">
            <input type="number" inputmode="decimal" id="discount-${i}" value="${rowData.discount || ''}" placeholder="" oninput="handleInput(${i})">
          </td>
          
          <!-- Column X (Disc Price) - Read-only output calculated as A - (A * Z / 100) -->
          <td class="col-x">
            <div class="read-only-cell" id="discPrice-${i}"></div>
          </td>

          <!-- Column X+18% (Price+GST) - Read-only output calculated as X * 1.18 -->
          <td class="col-xgst">
            <div class="read-only-cell" id="gst-${i}"></div>
          </td>

          <!-- Column B (Margin) - Input field (Purple header) -->
          <td class="col-b">
            <input type="number" inputmode="decimal" id="margin-${i}" value="${rowData.margin || ''}" placeholder="" oninput="handleInput(${i})">
          </td>

          <!-- Column C (Total) - Read-only output calculated as (X * 1.18) + B -->
          <td class="col-c">
            <div class="read-only-cell" id="total-${i}"></div>
          </td>

          <!-- Row Clear Action -->
          <td class="col-action">
            <button class="clear-row-btn" onclick="clearRow(${i})" title="Clear Row">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      }
      calculateAll();
    }

    function handleInput(index) {
      const priceVal = document.getElementById(`price-${index}`).value;
      const discountVal = document.getElementById(`discount-${index}`).value;
      const marginVal = document.getElementById(`margin-${index}`).value;

      rowsData[index] = { price: priceVal, discount: discountVal, margin: marginVal };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rowsData));
      calculateAll();
    }

    function calculateAll() {
      let sumA = 0;
      let sumZ = 0;
      let sumX = 0;
      let sumXgst = 0;
      let sumB = 0;
      let sumC = 0;

      for (let i = 0; i < TOTAL_ROWS; i++) {
        const priceInput = document.getElementById(`price-${i}`);
        const discountInput = document.getElementById(`discount-${i}`);
        const marginInput = document.getElementById(`margin-${i}`);

        if (!priceInput || !discountInput || !marginInput) continue;

        const price = parseFloat(priceInput.value) || 0;
        const discountPct = parseFloat(discountInput.value) || 0;
        const margin = parseFloat(marginInput.value) || 0;

        const hasPrice = priceInput.value.trim() !== "";
        const hasDiscount = discountInput.value.trim() !== "";
        const hasMargin = marginInput.value.trim() !== "";

        sumA += price;
        sumB += margin;
        if (hasDiscount) sumZ += discountPct;

        // Column X: Formula = A - (A * Z / 100)
        let discPrice = price;
        if (hasPrice) {
          if (hasDiscount && discountPct > 0) {
            discPrice = price - (price * (discountPct / 100));
          } else {
            discPrice = price;
          }
          sumX += discPrice;
        }

        // Column X+18%: Formula = X * 1.18
        const priceWithGst = hasPrice ? (discPrice * 1.18) : 0;
        sumXgst += priceWithGst;

        // Column C: Formula = (X * 1.18) + B
        const rowTotal = (hasPrice || hasMargin) ? (priceWithGst + margin) : 0;
        sumC += rowTotal;

        // Render Outputs
        document.getElementById(`discPrice-${i}`).textContent = hasPrice ? discPrice.toFixed(2) : "";
        document.getElementById(`gst-${i}`).textContent = hasPrice ? priceWithGst.toFixed(2) : "";
        document.getElementById(`total-${i}`).textContent = (hasPrice || hasMargin) ? rowTotal.toFixed(2) : "";
      }

      // Sticky TOT Footer updates in real-time
      document.getElementById("totalA").textContent = sumA ? sumA.toLocaleString('en-US') : "0";
      document.getElementById("totalZ").textContent = sumZ ? sumZ.toFixed(2) : "0.00";
      document.getElementById("totalX").textContent = sumX ? sumX.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
      document.getElementById("totalXgst").textContent = sumXgst ? sumXgst.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
      document.getElementById("totalB").textContent = sumB ? sumB.toLocaleString('en-US') : "0";
      document.getElementById("totalC").textContent = sumC ? sumC.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
    }

    function clearRow(index) {
      rowsData[index] = { price: "", discount: "", margin: "" };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rowsData));
      renderTable();
    }

    function resetAllData() {
      rowsData = Array.from({ length: TOTAL_ROWS }, () => ({ price: "", discount: "", margin: "" }));
      localStorage.removeItem(STORAGE_KEY);
      renderTable();
      showToast("All data reset to blank!");
    }

    function copyCSV() {
      let csv = "Price (A),Disc % (Z),Disc Price (X),Price+18% GST (X+18%),Margin (B),Total (C)\n";

      for (let i = 0; i < TOTAL_ROWS; i++) {
        const r = rowsData[i] || {};
        const p = r.price || '';
        const d = r.discount || '';
        const m = r.margin || '';
        if (p || m) {
          const pNum = parseFloat(p) || 0;
          const dPct = parseFloat(d) || 0;
          const mNum = parseFloat(m) || 0;
          const discPrice = dPct > 0 ? pNum - (pNum * (dPct / 100)) : pNum;
          const xgst = (discPrice * 1.18).toFixed(2);
          const c = (parseFloat(xgst) + mNum).toFixed(2);
          csv += `${p},${d}%,${discPrice.toFixed(2)},${xgst},${m},${c}\n`;
        }
      }

      const textarea = document.createElement("textarea");
      textarea.value = csv;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("Copied CSV to clipboard!");
      } catch (err) {
        showToast("Copy failed");
      }
      document.body.removeChild(textarea);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Initial render
    renderTable();
  </script>
</body>
</html>
